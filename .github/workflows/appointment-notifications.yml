name: Appointment Notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification processing endpoint
        run: |
          set -euo pipefail

          URL="${{ secrets.STUDENTOS_BASE_URL }}/api/notifications/process"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET }}"

          HTTP_CODE=$(curl --show-error --silent \
            --output response.json \
            --write-out "%{http_code}" \
            -X POST "$URL" \
            -H "$AUTH_HEADER")

          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Notification processing failed with status $HTTP_CODE"
            exit 1
          fi
