name: Appointment Notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification processing endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.STUDENTOS_BASE_URL }}/api/notifications/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
